name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite bakes VITE_* at build time. Without these, production RSVP has no relay URL (localhost still works via .env).
      - name: Build
        run: npm run build
        env:
          VITE_RSVP_RELAY_URL: ${{ secrets.VITE_RSVP_RELAY_URL }}
          VITE_RSVP_RELAY_SECRET: ${{ secrets.VITE_RSVP_RELAY_SECRET }}
          VITE_TG_BOT_TOKEN: ${{ secrets.VITE_TG_BOT_TOKEN }}
          VITE_TG_CHAT_ID: ${{ secrets.VITE_TG_CHAT_ID }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
